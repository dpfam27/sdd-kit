[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-kit"
version = "0.1.0"
description = "Spec-Driven Development toolkit — AI builds from your spec"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "gitpython>=3.1.0",
    "watchdog>=4.0.0",
]

[project.scripts]
sdd = "sdd_kit.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdd_kit*"]

[tool.setuptools.package-data]
sdd_kit = ["templates/*.md"]