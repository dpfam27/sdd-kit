[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdd-kit"
version = "0.2.1"
description = "Spec-Driven Development toolkit — AI builds from your spec, inside VS Code chat (@sdd)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SDD Kit contributors" }]
keywords = ["spec-driven", "ai", "vscode", "copilot", "scaffold", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Plugins",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/dpfam27/sdd-kit"
Repository = "https://github.com/dpfam27/sdd-kit"
Issues = "https://github.com/dpfam27/sdd-kit/issues"

[project.scripts]
sdd = "sdd_kit.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdd_kit*"]

[tool.setuptools.package-data]
sdd_kit = ["templates/*.md", "extension/*.vsix"]